name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check replatform tests repl.py
      - name: Compile
        run: python -m compileall -q replatform tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Coverage
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report
      - name: Dependency audit
        if: matrix.python-version == '3.12'
        run: python -m pip_audit -r requirements.txt --progress-spinner off
      - name: Build package
        if: matrix.python-version == '3.12'
        run: python -m build
      - name: Release tooling (dry run)
        if: matrix.python-version == '3.12'
        run: |
          python -m replatform.tools.release --dist dist --out dist --portable
          python -m replatform.tools.release --dist dist --verify
      - name: Self-test
        run: python repl.py selftest
