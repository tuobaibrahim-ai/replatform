[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replatform"
version = "1.3.0"
description = "منصة عربية للهندسة العكسية وتحليل البرمجيات الخبيثة والذكاء الاصطناعي"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "REPLATFORM contributors" }]
keywords = ["reverse-engineering", "malware-analysis", "security", "apk", "pe", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "pefile>=2024.8.26",
  "asn1crypto>=1.5.1",
  "certifi>=2024.2.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8"]
ai = ["tiktoken>=0.7"]

[project.scripts]
replatform = "replatform.cli:main"

[tool.setuptools.packages.find]
include = ["replatform*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
