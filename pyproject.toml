[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replatform"
version = "1.4.1"
description = "Windows reverse-engineering and malware-analysis platform (PE/APK, YARA, Ghidra, AI agents)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "REPLATFORM contributors" }]
maintainers = [{ name = "REPLATFORM maintainers" }]
keywords = [
  "reverse-engineering", "malware-analysis", "security", "apk", "pe",
  "yara", "ghidra", "threat-intelligence", "ai-agents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Natural Language :: Arabic",
  "Natural Language :: English",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Disassemblers",
  "Typing :: Typed",
]

dependencies = [
  "pefile>=2024.8.26",
  "asn1crypto>=1.5.1",
  "certifi>=2026.10.19",
]

[project.urls]
Homepage = "https://github.com/tuobaibrahim-ai/replatform"
Repository = "https://github.com/tuobaibrahim-ai/replatform"
Documentation = "https://github.com/tuobaibrahim-ai/replatform/blob/master/PLATFORM.md"
Changelog = "https://github.com/tuobaibrahim-ai/replatform/blob/master/CHANGELOG.md"
Issues = "https://github.com/tuobaibrahim-ai/replatform/issues"
Security = "https://github.com/tuobaibrahim-ai/replatform/security/policy"
Commercial = "https://github.com/tuobaibrahim-ai/replatform/blob/master/COMMERCIAL.md"

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8",
  "coverage>=7.4",
  "build>=1.2",
  "pip-audit>=2.7",
]
ai = ["tiktoken>=0.7"]

[project.scripts]
replatform = "replatform.cli:main"

[tool.setuptools.packages.find]
include = ["replatform*"]

[tool.setuptools.package-data]
replatform = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# نقاط الدخول (CLI/الواجهة/الاختبار الذاتي) تُختبَر تكاملياً عبر selftest،
# لذا تُستثنى من قياس تغطية الوحدات ليبقى الحد ذا معنى.
[tool.coverage.run]
source = ["replatform"]
omit = [
  "replatform/cli.py",
  "replatform/tools/selftest.py",
  "replatform/web/server.py",
]

[tool.coverage.report]
fail_under = 85
skip_covered = true
show_missing = true
